<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Order System Exercise6</title>
    <link rel="stylesheet" href="./menuOrderSystem.css">
</head>
<body>
    <div class="menu-order">
  <h2>🍔 Order System</h2>
  <div class="order-details">
    <div class="detail">
      <span class="label">Item:</span>
      <span class="value" id="item">--</span>
    </div>
    <div class="detail">
      <span class="label">Size:</span>
      <span class="value" id="size">--</span>
    </div>
    <div class="detail">
      <span class="label">Base Price:</span>
      <span class="value">$<span id="base">--</span></span>
    </div>
    <div class="detail">
      <span class="label">Multiplier:</span>
      <span class="value" id="mult">--</span>x</span>
    </div>
  </div>
  <div class="total-price">
    <span class="total-label">Total:</span>
    <span class="total-value">$<span id="total">--</span></span>
  </div>
</div>
<script src="./menuOrderSystem.js"></script>
    
</body>
</html>
