<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaining Array methods Exercise7</title>
    <link rel="stylesheet" href="./chainingArrayMethod.css">
</head>
<body>
    <div class="chain-demo">
  <h2>⛓️ Method Chaining</h2>
  <div class="products-table">
    <div class="table-header">
      <span>Product</span>
      <span>Price</span>
      <span>Status</span>
    </div>
    <div id="products-rows"></div>
  </div>
  <div class="chain-results">
    <div class="chain-box">
      <span class="chain-label">Expensive Products (>$1):</span>
      <span class="chain-value" id="expensive-names">--</span>
    </div>
    <div class="chain-box highlight">
      <span class="chain-label">Total of Expensive:</span>
      <span class="chain-value">$<span id="total-expensive">--</span></span>
    </div>
  </div>
</div>
    <script src="./chainingArrayMethod.js"></script>
</body>
</html>
