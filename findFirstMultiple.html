<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find First Multiple Exercise 4</title>
    <link rel="stylesheet" href="./findFirstMultiple.css">
</head>
<body>
    <div class="multiple-finder">
  <h2>🔍 Multiple Finder</h2>
  <div class="goal">Find first multiple of 7 greater than 50</div>
  <div class="search-visual">
    <div class="checking">Checked: <span id="checked">--</span> numbers</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>
  <div class="found-display">
    <span class="found-label">Found:</span>
    <span class="found-value" id="found">?</span>
  </div>
  <div class="verification" id="verify">--</div>
</div>
    
    <script src="./findFirstMultiple.js"></script>
</body>
</html>
