<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Filter Exercise5</title>
    <link rel="stylesheet" href="./arrayFilter.css">
</head>
<body>
    <div class="filter-demo">
  <h2>🔍 Array Filter</h2>
  <div class="scores-grid" id="scores-grid"></div>
  <div class="filter-results">
    <div class="filter-box passing">
      <span class="filter-label">Passing (≥60):</span>
      <span class="filter-value" id="passing">--</span>
      <span class="count" id="passing-count"></span>
    </div>
    <div class="filter-box failing">
      <span class="filter-label">Failing (&lt;60):</span>
      <span class="filter-value" id="failing">--</span>
      <span class="count" id="failing-count"></span>
    </div>
    <div class="filter-box excellent">
      <span class="filter-label">Excellent (≥90):</span>
      <span class="filter-value" id="excellent">--</span>
      <span class="count" id="excellent-count"></span>
    </div>
  </div>
</div>
    <script src="./arrayFilter.js"></script>
    
</body>
</html>
