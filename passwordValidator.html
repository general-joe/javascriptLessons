<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validator Exercise 5</title>
    <link rel="stylesheet" href="./passwordValidator.css">
</head>
<body>
    <div class="password-validator">
  <h2>🔐 Password Validator</h2>
  <div class="requirement">Minimum 6 characters required</div>
  <div class="password-list" id="password-list"></div>
  <div class="result-section">
    <div class="result-label">First Valid Password:</div>
    <div class="result-value" id="valid">--</div>
    <div class="attempt-count">Checked <span id="attempts">0</span> passwords</div>
  </div>
</div>

    <script src="./passwordValidator.js"></script>
</body>
</html>
