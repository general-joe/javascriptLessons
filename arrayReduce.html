<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Reduce Method Exercise6</title>
    <link rel="stylesheet" href="./arrayReduce.css">
</head>
<body>
    <div class="reduce-demo">
  <h2>🧮 Array Reduce</h2>
  <div class="prices-list" id="prices-list"></div>
  <div class="reduce-results">
    <div class="reduce-box">
      <span class="reduce-icon">➕</span>
      <div class="reduce-info">
        <span class="reduce-label">Total (sum all)</span>
        <span class="reduce-value">$<span id="total">--</span></span>
      </div>
    </div>
    <div class="reduce-box">
      <span class="reduce-icon">⬆️</span>
      <div class="reduce-info">
        <span class="reduce-label">Max Price</span>
        <span class="reduce-value">$<span id="max">--</span></span>
      </div>
    </div>
  </div>
</div>
    <script src="./arrayReduce.js"></script>
    
</body>
</html>
