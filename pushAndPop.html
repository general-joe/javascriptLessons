<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise on push and pop on an array</title>
    <link rel="stylesheet" href="./pushAndPop.css" />
  </head>
  <body>
    <div class="stack-demo">
      <h2>📚 Push & Pop (Stack)</h2>
      <div class="stack-visual" id="stack-visual"></div>
      <div class="operations">
        <div class="op">push('d') → push('e') → pop()</div>
      </div>
      <div class="result-grid">
        <div class="result-box">
          <span class="label">Final Stack:</span>
          <span class="value" id="stack-result">--</span>
        </div>
        <div class="result-box">
          <span class="label">Popped Value:</span>
          <span class="value" id="popped">--</span>
        </div>
      </div>
    </div>

    <script src="./puahAndPop.js"></script>
  </body>
</html>
