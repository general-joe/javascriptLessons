<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic For Loop Exercise1</title>
    <link rel="stylesheet" href="./basicForLoop.css">
</head>
<body>
    <div class="countdown-demo">
  <h2>⏬ Countdown</h2>
  <div class="loop-structure">
    <code>for (let i = 5; i >= 1; i--)</code>
  </div>
  <div class="countdown-visual" id="countdown-visual"></div>
  <div class="result-box">
    <span class="label">Countdown:</span>
    <span class="result" id="countdown">--</span>
  </div>
</div>
    
</body>
</html>
