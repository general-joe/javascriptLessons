<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic For Loop Exercise1</title>
    <link rel="stylesheet" href="./basicForLoop.css">
</head>
<body>
  <div class="for-loop-demo">
  <h2>🔄 Basic For Loop</h2>
  <div class="loop-structure">
    <code>for (let i = 1; i <= 5; i++)</code>
  </div>
  <div class="iterations" id="iterations"></div>
  <div class="result-box">
    <span class="label">Result:</span>
    <span class="result" id="result">--</span>
  </div>
</div>
    
</body>
</html>
