<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Operators Exercise 4</title>
</head>
<body>
    <div class="comparison-lab">
  <h2>⚖️ Comparison Operators</h2>
  <div class="values">
    <div class="value-box">a = <span id="val-a">--</span></div>
    <div class="value-box">b = <span id="val-b">--</span></div>
  </div>
  <div class="results">
    <div class="result-row">
      <span class="expr">a === b</span>
      <span class="result" id="r-equal">--</span>
    </div>
    <div class="result-row">
      <span class="expr">a !== b</span>
      <span class="result" id="r-notequal">--</span>
    </div>
    <div class="result-row">
      <span class="expr">a > b</span>
      <span class="result" id="r-greater">--</span>
    </div>
    <div class="result-row">
      <span class="expr">a <= b</span>
      <span class="result" id="r-lessequal">--</span>
    </div>
  </div>
</div>
</body>
</html>
