<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather Advisory System Exercise7</title>
    <link rel="stylesheet" href="./weatherAdvisorySystem.css">
</head>
<body>
    <div class="weather-system">
  <h2>🌤️ Weather Advisory</h2>
  <div class="conditions">
    <div class="condition">
      <span class="icon">🌡️</span>
      <span id="temp">--</span>°F
    </div>
    <div class="condition">
      <span class="icon" id="rain-icon">❓</span>
      <span id="rain-text">--</span>
    </div>
    <div class="condition">
      <span class="icon">💨</span>
      <span id="wind">--</span> mph
    </div>
  </div>
  <div class="status" id="status">--</div>
  <div class="advisories">
    <div class="advisory" id="umbrella-adv">
      <span class="adv-icon">☂️</span>
      <span class="adv-text">Umbrella: <span id="umbrella">--</span></span>
    </div>
    <div class="advisory" id="indoor-adv">
      <span class="adv-icon">🏠</span>
      <span class="adv-text">Stay Indoors: <span id="indoors">--</span></span>
    </div>
  </div>
</div>
<script src="./weatherAdvisorySystem.js"></script>
</body>
</html>
