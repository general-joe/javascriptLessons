<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch With Strings Exercise4</title>
    <link rel="stylesheet" href="./switchWithStrings.css">
</head>
<body>
    <div class="command-terminal">
  <h2>💻 Command Terminal</h2>
  <div class="terminal-window">
    <div class="terminal-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
    <div class="terminal-body">
      <div class="command-line">
        <span class="prompt">$</span>
        <span class="cmd" id="command">--</span>
      </div>
      <div class="response" id="response">--</div>
    </div>
  </div>
</div>
<script src="./switchWithStrings.js"></script>
</body>
</html>
