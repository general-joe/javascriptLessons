<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Character Stats Exercise7</title>
    <link rel="stylesheet" href="./gameCharacterStats.css">
</head>
<body>
    <div class="character-creator">
  <h2>⚔️ Character Stats</h2>
  <div class="class-name" id="class-name">--</div>
  <div class="stats-grid">
    <div class="stat">
      <span class="stat-icon">❤️</span>
      <span class="stat-name">Health</span>
      <span class="stat-value" id="health">--</span>
    </div>
    <div class="stat">
      <span class="stat-icon">⚔️</span>
      <span class="stat-name">Attack</span>
      <span class="stat-value" id="attack">--</span>
    </div>
    <div class="stat">
      <span class="stat-icon">🛡️</span>
      <span class="stat-name">Defense</span>
      <span class="stat-value" id="defense">--</span>
    </div>
  </div>
  <div class="special-ability">
    <span class="special-label">Special:</span>
    <span class="special-name" id="special">--</span>
  </div>
</div>
<script src="./gameCharacterStats.js"></script>
    
</body>
</html>
