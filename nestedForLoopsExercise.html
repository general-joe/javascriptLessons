<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested For Loop Exercise</title>
    <link rel="stylesheet" href="./nestedForLoopsExercise.css">
</head>
<body>
    <div class="multiplication-table">
  <h2>✖️ Multiplication Table</h2>
  <div class="loop-structure">
    <code>for i=1 to 3 { for j=1 to 3 { i × j } }</code>
  </div>
  <div class="table-grid" id="table-grid"></div>
  <div class="result-box">
    <pre class="result" id="table">--</pre>
  </div>
</div>
    <script src="./nestedForLoopsExercise.js"></script>
</body>
</html>
