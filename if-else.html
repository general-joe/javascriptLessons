<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements in JavaScript</title>
</head>
<body>
  <div id="output"></div>
  <script>
    const outputDive = document.getElementById('output');
    const age = prompt("Please enter your age:");
    if (age >= 18){
        outputDive.innerHTML = "You are an adult.";
    }else{
        outputDive.innerHTML = "You are a minor.";
        }
  </script>
</body>
</html>
