<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array map method Exercise4 </title>
    <link rel="stylesheet" href="./arrayMap.css">
</head>
<body>
    <div class="map-demo">
  <h2>🗺️ Array Map</h2>
  <div class="transform-visual">
    <div class="array-row">
      <span class="row-label">Original:</span>
      <div class="nums" id="original"></div>
    </div>
    <div class="arrow">↓ n => n * 2</div>
    <div class="array-row">
      <span class="row-label">Doubled:</span>
      <div class="nums" id="doubled"></div>
    </div>
    <div class="arrow">↓ n => n * n</div>
    <div class="array-row">
      <span class="row-label">Squared:</span>
      <div class="nums" id="squared"></div>
    </div>
  </div>
</div>


    <script src="./arrayMap.js"></script>
</body>
</html>
