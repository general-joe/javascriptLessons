<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Operators exercise 5</title>
    <link rel="stylesheet" href="./logicalOperators.css">
</head>
<body>
    <div class="access-control">
  <h2>🔐 Access Control System</h2>
  <div class="user-status">
    <div class="status-item">
      <span class="label">Logged In:</span>
      <span class="badge" id="logged-in">--</span>
    </div>
    <div class="status-item">
      <span class="label">Admin:</span>
      <span class="badge" id="admin">--</span>
    </div>
    <div class="status-item">
      <span class="label">Premium:</span>
      <span class="badge" id="premium">--</span>
    </div>
  </div>
  <div class="permissions">
    <h3>Permissions</h3>
    <div class="perm-item">
      <span>Full Access (Admin)</span>
      <span class="perm-badge" id="full-access">--</span>
    </div>
    <div class="perm-item">
      <span>View Content</span>
      <span class="perm-badge" id="view-content">--</span>
    </div>
    <div class="perm-item">
      <span>Is Guest</span>
      <span class="perm-badge" id="is-guest">--</span>
    </div>
  </div>
</div>



    <script src="./logicalOperators.js"></script>

</body>
</html>
