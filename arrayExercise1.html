<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating and accessing an array</title>
    <link rel="stylesheet" href="./arrayExercise1.css">
</head>
<body>
    <div class="array-basics">
  <h2>🎨 Array Basics</h2>
  <div class="array-visual" id="array-visual"></div>
  <div class="info-grid">
    <div class="info-box">
      <span class="label">First [0]:</span>
      <span class="value" id="first">--</span>
    </div>
    <div class="info-box">
      <span class="label">Last [length-1]:</span>
      <span class="value" id="last">--</span>
    </div>
    <div class="info-box">
      <span class="label">Length:</span>
      <span class="value" id="length">--</span>
    </div>
  </div>
</div>
    <script src="./arrayExercise1.js"></script>
    
</body>
</html>
