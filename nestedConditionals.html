<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Conditionals Exercise6</title>
    <link rel="stylesheet" href="./nestedConditionals.css">
</head>
<body>
    <div class="ticket-pricing">
  <h2>🎬 Movie Ticket Pricing</h2>
  <div class="inputs">
    <div class="input-group">
      <span class="label">Age:</span>
      <span class="value" id="age">--</span>
    </div>
    <div class="input-group">
      <span class="label">Matinee:</span>
      <span class="value" id="matinee">--</span>
    </div>
  </div>
  <div class="price-display">
    <div class="price-label">Your Price</div>
    <div class="price" id="price">$--</div>
    <div class="price-type" id="price-type">--</div>
  </div>
  <div class="price-guide">
    <div>Child (&lt;12): $8</div>
    <div>Senior (65+): $10</div>
    <div>Matinee: $10</div>
    <div>Regular: $15</div>
  </div>
</div>
<script src="./nestedConditionals.js"></script>
</body>
</html>
