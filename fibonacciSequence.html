<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fibonacci Sequence Exercise 6</title>
    <link rel="stylesheet" href="./fibonacciSequence.css" />
  </head>
  <body>
    <div class="fibonacci-generator">
      <h2>🌀 Fibonacci Generator</h2>
      <div class="limit-info">Generate until sum &gt; 100</div>
      <div class="spiral-visual" id="spiral"></div>
      <div class="sequence-display">
        <div class="seq-label">Sequence:</div>
        <div class="seq-value" id="sequence">--</div>
      </div>
      <div class="current-values">
        <div class="value-box">a = <span id="val-a">--</span></div>
        <div class="value-box">b = <span id="val-b">--</span></div>
      </div>
    </div>
    <script src="./fibonacciSequence.js"></script>
  </body>
</html>
