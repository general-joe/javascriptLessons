<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sum Calculator Exercise2</title>
    <link rel="stylesheet" href="./sum-calculator.css" />
  </head>
  <body>
    <div class="sum-calculator">
      <h2>➕ Sum Calculator</h2>
      <div class="formula">1 + 2 + 3 + ... + <span id="limit">?</span></div>
      <div class="sum-visual" id="sum-visual"></div>
      <div class="total">
        <span class="equals">=</span>
        <span class="sum-value" id="sum">?</span>
      </div>
    </div>

    <script src="./sum-calculator.js"></script>
  </body>
</html>
