<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift and Unshift coding challenge on an array</title>
    <link rel="stylesheet" href="./shiftUnshift.css">
</head>
<body>
    <div class="queue-demo">
  <h2>📥 Shift & Unshift (Queue)</h2>
  <div class="queue-visual" id="queue-visual"></div>
  <div class="operations">
    <div class="op">unshift(1) → unshift(0) → shift()</div>
  </div>
  <div class="result-grid">
    <div class="result-box">
      <span class="label">Final Queue:</span>
      <span class="value" id="queue-result">--</span>
    </div>
    <div class="result-box">
      <span class="label">Shifted Value:</span>
      <span class="value" id="shifted">--</span>
    </div>
  </div>
</div>
    <script src="./shiftUnshift.js"></script>
    
</body>
</html>
